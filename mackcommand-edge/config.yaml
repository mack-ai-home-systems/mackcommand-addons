# MackCommand — published add-on config.
# This file carries NO source. The code ships as a pre-built image from GHCR, so a hub
# downloads a finished container instead of compiling on an SD card. Bump `version` here
# to release; it is the image tag, and it is what surfaces the Update button.
name: MackCommand (Edge)
version: "0.177.0"
slug: mackcommand-edge
description: MackCommand canary channel — the flagship only. Never install on a client hub.
url: https://mackcommand.com
image: ghcr.io/mack-ai-home-systems/mackcommand
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard
panel_title: MackCommand Edge
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": MackCommand web UI (direct)
options:
  notify_service: ""
  heartbeat_url: ""
  support_name: "Mack AI Home Systems"
  support_contact: ""
schema:
  notify_service: "str?"
  heartbeat_url: "str?"
  support_name: "str?"
  support_contact: "str?"
map:
  - homeassistant_config:ro
hassio_api: true
homeassistant_api: true
